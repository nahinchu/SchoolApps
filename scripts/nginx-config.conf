# =====================================================
# Nginx Reverse Proxy Configuration
# =====================================================
# File location: /etc/nginx/sites-available/schoolapp
# Copy this file to /etc/nginx/sites-available/schoolapp
# Then: ln -s /etc/nginx/sites-available/schoolapp /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl restart nginx

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name schoolapp.com.vn www.schoolapp.com.vn;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Actual application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name schoolapp.com.vn www.schoolapp.com.vn;

    # SSL certificates (from Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/schoolapp.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolapp.com.vn/privkey.pem;

    # SSL configuration (strong security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/schoolapp_access.log;
    error_log /var/log/nginx/schoolapp_error.log;

    # Root location
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Static files (optional - if needed)
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     proxy_pass http://localhost:5000;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # Disable access to sensitive files
    location ~ /\.env {
        deny all;
    }

    location ~ /appsettings {
        deny all;
    }
}
