version: '3.8'

services:
  # ASP.NET Core App
  app:
    image: schoolapp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnectionStringDB=Server=localhost,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True
      - MinIO__Endpoint=${MINIO_ENDPOINT}
      - MinIO__AccessKey=${MINIO_ACCESS_KEY}
      - MinIO__SecretKey=${MINIO_SECRET_KEY}
      - MinIO__UseSSL=false
      - MinIO__BucketName=${MINIO_BUCKET}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__SenderName=${SENDER_NAME}
    ports:
      - "5000:80"
    depends_on:
      sql:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    networks:
      - schoolapp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  # SQL Server Database
  sql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql-server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - /opt/schoolapp/data/mssql/data:/var/opt/mssql/data
      - /opt/schoolapp/data/mssql/log:/var/opt/mssql/log
      - /opt/schoolapp/data/mssql/backup:/var/opt/mssql/backup
    restart: always
    networks:
      - schoolapp
    healthcheck:
      test: [
        "CMD",
        "/opt/mssql-tools/bin/sqlcmd",
        "-S",
        "localhost",
        "-U",
        "sa",
        "-P",
        "${DB_PASSWORD}",
        "-Q",
        "SELECT 1"
      ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio-server
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - schoolapp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  sql_data:
  sql_log:
  sql_backup:
  minio_data:

networks:
  schoolapp:
    driver: bridge
